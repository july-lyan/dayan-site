<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800">
  <defs>
    <linearGradient id="deep" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#091716"/>
      <stop offset="1" stop-color="#18352f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f3dfa9"/>
      <stop offset="0.55" stop-color="#bb9551"/>
      <stop offset="1" stop-color="#e3c16e"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#49d6bc"/>
      <stop offset="1" stop-color="#198472"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#07100f" flood-opacity="0.18"/>
    </filter>
    <style>
      .bg { fill: #efeee6; }
      .title { font-family: "Songti SC", "Noto Serif CJK SC", serif; font-size: 44px; font-weight: 700; fill: #12201d; letter-spacing: 0.08em; }
      .sub { font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 23px; fill: #5d6a65; }
      .card { fill: #fbfaf4; stroke: #dad4c4; stroke-width: 1.5; filter: url(#shadow); }
      .label { font-family: "Avenir Next", "PingFang SC", sans-serif; font-size: 24px; font-weight: 700; fill: #263631; letter-spacing: 0.06em; }
      .desc { font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 18px; fill: #68746e; }
      .cn { font-family: "Songti SC", "Noto Serif CJK SC", serif; font-weight: 700; letter-spacing: 0.08em; }
      .en { font-family: "Avenir Next", "Montserrat", sans-serif; font-weight: 600; letter-spacing: 0.18em; }
      .dark { fill: #101b18; }
      .deep { fill: url(#deep); }
      .gold { fill: url(#gold); }
      .gold-line { fill: none; stroke: url(#gold); stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
      .dark-line { fill: none; stroke: #101b18; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
      .teal-line { fill: none; stroke: url(#teal); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1800"/>
  <text x="92" y="92" class="title">雁洄 Logo 方向 V2</text>
  <text x="92" y="136" class="sub">从“画一只鸟”切到“公司识别符号”。更适合注册公司、牌匾、合同抬头、公众号头像和课程产品。</text>

  <!-- Direction 01 -->
  <g transform="translate(92 210)">
    <rect class="card" width="760" height="470" rx="34"/>
    <text x="42" y="58" class="label">01 / 洄环雁首 · 主推</text>
    <text x="42" y="92" class="desc">用回旋曲线形成雁首和水流，抽象程度更高，适合长期品牌。</text>
    <g transform="translate(160 148)">
      <path class="dark-line" d="M0 150 C84 36, 244 12, 372 92 C288 82, 204 116, 144 178"/>
      <path class="dark-line" d="M96 206 C190 138, 324 132, 442 178"/>
      <path class="teal-line" d="M154 174 C256 134, 374 132, 496 158"/>
      <path class="dark-line" d="M374 92 C430 104, 476 134, 506 170 C538 166, 568 154, 596 136"/>
      <path class="dark" d="M594 136 L660 164 L594 192 C612 172 612 154 594 136Z"/>
      <circle cx="522" cy="161" r="9" class="dark"/>
    </g>
  </g>

  <!-- Direction 02 -->
  <g transform="translate(948 210)">
    <rect class="card" width="760" height="470" rx="34"/>
    <text x="42" y="58" class="label">02 / 雁洄字章</text>
    <text x="42" y="92" class="desc">以“雁洄”二字的结构做现代印章，文化科技两端都能承接。</text>
    <g transform="translate(276 132)">
      <rect x="0" y="0" width="220" height="220" rx="46" class="deep"/>
      <path d="M54 70 C98 42, 154 42, 188 76 C142 64, 98 74, 70 112" fill="none" stroke="#f4dfad" stroke-width="16" stroke-linecap="round"/>
      <path d="M54 148 C102 112, 164 110, 202 134" fill="none" stroke="#f4dfad" stroke-width="16" stroke-linecap="round"/>
      <path d="M86 112 C132 92, 176 92, 216 108" fill="none" stroke="#49d6bc" stroke-width="10" stroke-linecap="round"/>
      <path d="M154 74 C188 84, 206 104, 216 126 L248 110 L216 150 C194 136, 178 112, 154 74Z" fill="#f4dfad"/>
    </g>
  </g>

  <!-- Direction 03 -->
  <g transform="translate(92 770)">
    <rect class="card" width="760" height="470" rx="34"/>
    <text x="42" y="58" class="label">03 / YH 回线</text>
    <text x="42" y="92" class="desc">把 YH 做成企业 monogram，弱化动物形，现代感最强。</text>
    <g transform="translate(170 138)">
      <path d="M0 0 L116 126 L232 0" fill="none" stroke="#101b18" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M282 0 V226" fill="none" stroke="#101b18" stroke-width="30" stroke-linecap="round"/>
      <path d="M282 112 H430" fill="none" stroke="#101b18" stroke-width="30" stroke-linecap="round"/>
      <path d="M430 0 V226" fill="none" stroke="#101b18" stroke-width="30" stroke-linecap="round"/>
      <path d="M108 126 C210 76, 334 72, 456 106" class="teal-line"/>
      <path d="M456 106 C498 106, 536 90, 568 62" fill="none" stroke="#101b18" stroke-width="18" stroke-linecap="round"/>
      <path class="dark" d="M566 62 L630 90 L566 118 C584 98 584 80 566 62Z"/>
    </g>
  </g>

  <!-- Direction 04 -->
  <g transform="translate(948 770)">
    <rect class="card" width="760" height="470" rx="34"/>
    <text x="42" y="58" class="label">04 / 雁阵三线</text>
    <text x="42" y="92" class="desc">三条迁徙轨迹代表内容、工具、课程三条业务线，适合集团感。</text>
    <g transform="translate(132 158)">
      <path class="dark-line" d="M0 70 C92 4, 214 2, 328 62"/>
      <path class="gold-line" d="M78 142 C194 58, 356 54, 492 112"/>
      <path class="dark-line" d="M176 222 C292 142, 442 134, 584 184"/>
      <path class="teal-line" d="M146 142 C268 106, 410 106, 544 136"/>
      <path class="dark" d="M582 184 L652 210 L584 240 C604 218, 604 198, 582 184Z"/>
      <circle cx="540" cy="136" r="12" fill="#198472"/>
    </g>
  </g>

  <!-- Main lockup -->
  <g transform="translate(92 1350)">
    <rect width="1616" height="300" rx="38" class="deep" filter="url(#shadow)"/>
    <g transform="translate(70 84) scale(0.42)">
      <path class="gold-line" d="M0 150 C84 36, 244 12, 372 92 C288 82, 204 116, 144 178"/>
      <path class="gold-line" d="M96 206 C190 138, 324 132, 442 178"/>
      <path class="teal-line" d="M154 174 C256 134, 374 132, 496 158"/>
      <path class="gold-line" d="M374 92 C430 104, 476 134, 506 170 C538 166, 568 154, 596 136"/>
      <path class="gold" d="M594 136 L660 164 L594 192 C612 172 612 154 594 136Z"/>
      <circle cx="522" cy="161" r="11" class="gold"/>
    </g>
    <text x="390" y="128" class="cn" font-size="66" fill="#f7efd9">杭州雁洄文化科技有限公司</text>
    <text x="394" y="194" class="en" font-size="22" fill="#d7c391">HANGZHOU YANHUI CULTURE TECHNOLOGY CO., LTD.</text>
  </g>
</svg>
