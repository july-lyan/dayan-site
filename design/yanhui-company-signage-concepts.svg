<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1615"/>
      <stop offset="1" stop-color="#102421"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f1d9a2"/>
      <stop offset="0.45" stop-color="#b89454"/>
      <stop offset="1" stop-color="#fff0c2"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#58e0c2"/>
      <stop offset="1" stop-color="#1b8a78"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <style>
      .bg { fill: #eef0e8; }
      .card { fill: url(#panel); filter: url(#softShadow); }
      .gold { fill: url(#gold); }
      .gold-stroke { fill: none; stroke: url(#gold); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .jade-stroke { fill: none; stroke: url(#jade); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .cn { font-family: "Songti SC", "Noto Serif CJK SC", serif; font-weight: 700; letter-spacing: 0.08em; }
      .en { font-family: "Avenir Next", "Montserrat", sans-serif; font-weight: 500; letter-spacing: 0.24em; }
      .label { font-family: "Avenir Next", "PingFang SC", sans-serif; font-size: 24px; fill: #42524d; letter-spacing: 0.08em; }
      .note { font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 22px; fill: #66736f; }
      .metal { fill: #d7c39d; }
      .darkText { fill: #14211f; }
      .lightText { fill: #f7efd9; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1200"/>
  <text x="90" y="92" class="label">杭州雁洄文化科技有限公司 · 公司牌匾方向</text>
  <text x="90" y="130" class="note">关键词：长颈大雁、回环、文化内容、AI 科技、杭州气质。推荐先落地方案 A，牌面清晰，适合门头和背景墙。</text>

  <!-- Concept A: main horizontal sign -->
  <g transform="translate(90 190)">
    <text x="0" y="-26" class="label">A / 门头横牌 · 推荐主方案</text>
    <rect class="card" x="0" y="0" width="1620" height="300" rx="34"/>
    <g transform="translate(96 82) scale(0.62)">
      <path class="gold-stroke" d="M26 176 C86 90, 182 56, 284 82 C210 96, 154 130, 112 178"/>
      <path class="gold-stroke" d="M70 214 C160 154, 276 140, 388 172 C272 174, 172 198, 92 254"/>
      <path class="jade-stroke" d="M128 188 C226 154, 326 146, 428 160"/>
      <path class="gold-stroke" d="M322 90 C390 96, 442 128, 478 160"/>
      <path class="gold-stroke" d="M478 160 C512 156, 542 146, 568 130"/>
      <path class="gold" d="M568 130 L628 154 L568 176 C584 160 584 146 568 130Z"/>
      <circle cx="512" cy="151" r="8" class="gold"/>
      <circle cx="596" cy="154" r="6" fill="#58e0c2"/>
    </g>
    <text x="560" y="122" class="cn lightText" font-size="58">杭州雁洄文化科技有限公司</text>
    <text x="562" y="184" class="en lightText" font-size="22">HANGZHOU YANHUI CULTURE TECHNOLOGY CO., LTD.</text>
    <line x1="562" y1="218" x2="1360" y2="218" stroke="#d6bc7a" stroke-width="2" opacity="0.55"/>
    <text x="562" y="254" class="note" fill="#d9ceb2">内容产品 · AI 工具 · 课程与品牌增长</text>
  </g>

  <!-- Concept B: brass office plaque -->
  <g transform="translate(90 580)">
    <text x="0" y="-26" class="label">B / 办公室铜牌 · 工商登记与门口挂牌</text>
    <rect x="0" y="0" width="760" height="360" rx="20" fill="#c8ad72" filter="url(#softShadow)"/>
    <rect x="24" y="24" width="712" height="312" rx="12" fill="none" stroke="#fff0bf" stroke-width="3" opacity="0.65"/>
    <g transform="translate(56 78) scale(0.42)">
      <path fill="none" stroke="#182220" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" d="M26 176 C86 90, 182 56, 284 82 C210 96, 154 130, 112 178"/>
      <path fill="none" stroke="#182220" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" d="M70 214 C160 154, 276 140, 388 172 C272 174, 172 198, 92 254"/>
      <path fill="none" stroke="#182220" stroke-width="8" stroke-linecap="round" d="M128 188 C226 154, 326 146, 428 160"/>
      <path fill="none" stroke="#182220" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" d="M322 90 C390 96, 442 128, 478 160"/>
      <path fill="none" stroke="#182220" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" d="M478 160 C512 156, 542 146, 568 130"/>
      <path fill="#182220" d="M568 130 L628 154 L568 176 C584 160 584 146 568 130Z"/>
      <circle cx="512" cy="151" r="10" fill="#182220"/>
    </g>
    <text x="350" y="140" class="cn darkText" font-size="42">杭州雁洄</text>
    <text x="350" y="202" class="cn darkText" font-size="42">文化科技有限公司</text>
    <text x="352" y="260" class="en darkText" font-size="15">YANHUI CULTURE TECHNOLOGY</text>
  </g>

  <!-- Concept C: vertical wayfinding -->
  <g transform="translate(970 580)">
    <text x="0" y="-26" class="label">C / 竖版导视 · 展会、前台侧牌、工位铭牌</text>
    <rect class="card" x="0" y="0" width="360" height="520" rx="34"/>
    <g transform="translate(42 62) scale(0.42) rotate(7)">
      <path class="gold-stroke" d="M26 176 C86 90, 182 56, 284 82 C210 96, 154 130, 112 178"/>
      <path class="gold-stroke" d="M70 214 C160 154, 276 140, 388 172 C272 174, 172 198, 92 254"/>
      <path class="jade-stroke" d="M128 188 C226 154, 326 146, 428 160"/>
      <path class="gold-stroke" d="M322 90 C390 96, 442 128, 478 160"/>
      <path class="gold-stroke" d="M478 160 C512 156, 542 146, 568 130"/>
      <path class="gold" d="M568 130 L628 154 L568 176 C584 160 584 146 568 130Z"/>
      <circle cx="512" cy="151" r="9" class="gold"/>
    </g>
    <text x="178" y="258" class="cn lightText" font-size="44" writing-mode="tb" glyph-orientation-vertical="0">杭州雁洄文化科技</text>
    <text x="178" y="482" text-anchor="middle" class="en lightText" font-size="12">YANHUI CULTURE TECH</text>
  </g>

  <!-- Palette and production notes -->
  <g transform="translate(1390 580)">
    <text x="0" y="-26" class="label">制作建议</text>
    <rect x="0" y="0" width="320" height="520" rx="28" fill="#ffffff" opacity="0.82"/>
    <circle cx="44" cy="58" r="18" fill="#102421"/>
    <text x="78" y="66" class="note">底板：深青黑亚克力</text>
    <circle cx="44" cy="112" r="18" fill="#c8ad72"/>
    <text x="78" y="120" class="note">字标：拉丝香槟金</text>
    <circle cx="44" cy="166" r="18" fill="#58e0c2"/>
    <text x="78" y="174" class="note">点缀：低饱和青绿</text>
    <text x="34" y="252" class="note">推荐工艺：</text>
    <text x="34" y="292" class="note">1. 黑色亚克力背板</text>
    <text x="34" y="332" class="note">2. 金属字 8-12mm 厚</text>
    <text x="34" y="372" class="note">3. 图形可做发光边</text>
    <text x="34" y="412" class="note">4. 英文可按需省略</text>
    <text x="34" y="468" class="note">门头优先用 A；正式门口铜牌用 B。</text>
  </g>
</svg>
